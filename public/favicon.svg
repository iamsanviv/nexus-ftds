  <path d="M37 22 L45 22 L45 30" fill="none" stroke="#F6DA8A"
    stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="22" r="2.6" fill="#F6DA8A"/>
