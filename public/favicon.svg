<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo Nexus: línea de tendencia dorada con flecha, sobre panel oscuro
       con contorno dorado tenue. Colores del sistema (styles.css). -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6f2e"/>
      <stop offset=".55" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#F6DA8A"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="15" fill="#0E1116" stroke="#8a6f2e" stroke-width="2"/>
  <polyline points="18,41 27,32 34,36 45,22" fill="none" stroke="url(#g)"
