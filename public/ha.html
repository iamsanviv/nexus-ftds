<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/styles.css"></head><body>
<div style="max-width:560px;margin:0 auto;padding:16px 12px">
<div id="segFormPanel" class="formpanel">
      <div class="fph">
        <h3 class="fpt" id="segFormTitulo">Nueva actividad del día</h3>
        <button class="fpx" id="segFormCerrar" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="fgrid">
        <div class="frow wide"><label>Actividad</label><select id="segSrv"></select></div>
        <!-- nombre libre: solo cuando se elige «actividad puntual» -->
        <div class="frow wide hidden" id="segLibreRow">
          <label>Nombre de la actividad</label>
          <input id="segLibre" placeholder="Ej: Lanzamiento de membresías" autocomplete="off">
          <div class="msgshelp">No entra al catálogo ni cuenta para el progreso de nadie. Úsalo para cosas de una sola vez.</div>
        </div>
        <div class="frow"><label>Fecha</label><input type="date" id="segFecha"></div>
        <div class="frow"><label>Hora (Colombia)</label><input type="time" id="segHora"></div>
        <div class="frow wide"><label>Enlace de la sala <span class="opt">(opcional — puedes agregarlo luego)</span></label><input id="segLink" placeholder="https://…"></div>
      </div>
      <div class="segformbtns">
        <button class="authbtn" id="segCrearAct">Guardar actividad</button>
        <button class="tbtn hidden" id="segCancelEdit">Cancelar edición</button>
      </div>
    </div>

    
<div class="sechead" style="margin-top:20px"><h3>Actividades del día</h3><span class="cnt">2</span><span class="rule"></span></div>
<div class="acts" id="acts"></div>
</div><script src="/ha.js"></script></body></html>
