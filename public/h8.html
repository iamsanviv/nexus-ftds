<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/styles.css"></head><body class="segwide">
<div style="max-width:760px;margin:0 auto;padding:16px 12px"><div id="segProgBloque">
      <div class="actsel" id="segProgTitulo"></div>

      <!-- segmentos guardados / historial: reutilizar una selección anterior -->
      <div id="segSegmentos" class="segsegmentos"></div>

      <div class="pstitle">Elige a quién incluir</div>
      <div class="masbuscarwrap"><input type="search" id="segBuscar" placeholder="🔎 Buscar por nombre…" autocomplete="off"><button id="segBuscarX" class="masbuscarx hidden" title="Limpiar">✕</button></div>
      <div id="segFiltros" class="segfiltros"></div>
      <label class="segtoggle"><input type="checkbox" id="segIncAsis"> Incluir a quienes ya asistieron (para reinvitar)</label>
      <label class="segtoggle"><input type="checkbox" id="segSinInv"> No enviar invitación — ya los invité por llamada o por otro mensaje</label>
      <div class="segselbar">
        <span id="segSelCount" class="segselcount"></span>
        <button class="pill" id="segMarcarVis">✓ Marcar visibles</button>
        <button class="pill" id="segDesmarcarVis">✗ Desmarcar visibles</button>
      </div>
      <div id="segFaltan" class="seg-lista"></div>
      <div class="progrow">
        <button class="authbtn" id="segProgramar">Programar mensajes</button>
        <button class="progtarde" id="segTardeToggle" title="Programar la invitación para más tarde">🕓 Más tarde</button>
      </div>
      <div id="segTardeRow" class="progtarderow hidden">
        <span class="progtardelbl">Enviar la invitación:</span>
        <input type="datetime-local" id="segTardeCuando">
      </div>
      <button class="pill segguardar" id="segGuardarSeg">💾 Guardar esta selección como segmento</button>
    </div>

    </div>
<script src="/h8.js"></script></body></html>
